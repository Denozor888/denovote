<!DOCTYPE html>
<html>
<head>
    <title>Denovote</title>
</head>
<body>

<h1>DENOVOTE</h1>

<p>döner</p>
<button onclick="oyVer('döner')">Oy Ver</button>

<p>hamburger</p>
<button onclick="oyVer('hamburger')">Oy Ver</button>
<img src="https://www.kevserinmutfagi.com/wp-content/uploads/2012/01/hamburger2.jpghttps://www.kevserinmutfagi.com/wp-content/uploads/2012/01/hamburger2.jpghttps://www.kevserinmutfagi.com/wp-content/uploads/2012/01/hamburger2.jpg">

<h2>Oy Sonuçları:</h2>
<p id="sonuc">Henüz oy yok</p> 

<button onclick="sifirla()">Sıfırla</button>

<script>
let oylar = {
    "döner": 0,
    "hamburger": 0
};

function oyVer(secenek) {
    oylar[secenek]++;
    document.getElementById("sonuc").innerText = 
        "Döner: " + oylar["döner"] + " | Hamburger: " + oylar["hamburger"];
}

function sifirla() {
    oylar["döner"] = 0;
    oylar["hamburger"] = 0;
    document.getElementById("sonuc").innerText = "Henüz oy yok";
}
</script>

</body>
</html>
